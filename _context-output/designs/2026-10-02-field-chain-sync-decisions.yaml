# ─────────────────────────────────────────────────────────────────────────────
goal:
  - node: Q1
    decision: "迭代范围 = A 正确性 + B 优先级与重应用 + C 流程 + D 界面（全组合）"
    alternatives:
      - option: "只做 D 界面"
        rejected_reason: "侦察证明「改了不生效」是非 UI 缺陷，只做界面会把它留在原地"
    rationale: "B（重定/触发重应用）正是这些缺陷的修法"
    implications: "单一设计文档 → 单一计划"
    status: RESOLVED

  - node: Q2
    decision: "「同步」的语义 = 纯派生（只读重算）；编辑只写它所属那一层，三视图都从链重算"
    alternatives:
      - option: "双向写传播"
        rejected_reason: "把「改这一个标签页」静默放大成「改该槽全局」，作用域失控且不可逆"
      - option: "派生 + 显式同步"
        rejected_reason: "保留为可选动作，非默认"
    status: RESOLVED

  - node: Q3
    decision: "slot 的「对应 tabId」= 模拟一次真实切换（复用 resolveSwitch）；位置槽不推算，用已记录 binding"
    alternatives:
      - option: "候选集合成员判定"
        rejected_reason: "多值会让 Dashboard 联动标注随排序抖动"
    status: RESOLVED

  - node: Q4
    decision: "重算+重投递收敛为单一服务入口 recomputeAndRedeliver(affectedTabIds) + 显式调用"
    alternatives:
      - option: "纯事件驱动"
        rejected_reason: "写入方无法表达「这是清除」，清除语义会继续只在部分路径生效"
      - option: "各写入方自理"
        rejected_reason: "即现状，正是缺陷来源"
    status: RESOLVED

  - node: Q5
    decision: "共享字段链抽成 src/shared/field-chain.ts 纯函数；UI 用内存 state 同步计算"
    alternatives:
      - option: "保留在 background + 新增 COMPUTE_FIELDS 消息"
        rejected_reason: "侧边栏是高频路径，每次 onActivated/onUpdated 都往返一次"
      - option: "保留两份 + 锁步测试"
        rejected_reason: "只能事后发现分叉"
    implications: "「视图显示值 = 实际投递值」成为构造保证；顺带修掉 UI 侧缺协议白名单"
    status: RESOLVED

  - node: Q6
    decision: "「清除/Reset」= 回落下一层 + 站点原值还原"
    alternatives:
      - option: "只「停止干预」"
        rejected_reason: "标题半场不可靠：多数站点不会重设 title"
      - option: "维持清空行为"
        rejected_reason: "Reset 后标题变空、图标消失，比不清除更糟"
    implications: "只需两种投递模式 apply / restore-site"
    status: RESOLVED

  - node: Q7
    decision: "三视图一致显示：来源徽标 + 遮蔽标记 + 一键清除；徽标可点击跳焦"
    alternatives:
      - option: "只在 Dashboard 集中呈现"
        rejected_reason: "用户察觉问题的地方没有解法"
    status: RESOLVED

  - node: Q8
    decision: "影响面标注时机 = 两者都要（编辑期行内实时预览 + 提交后权威汇总）"
    rationale: "A 是预测（基于当前快照），B 为权威；已知并接受预测可能不同"
    status: RESOLVED

  - node: Q9
    decision: "影响面列表粒度 = 计数 + 前 3 条 + 折叠展开"
    alternatives:
      - option: "只给计数 + 跳 Dashboard"
        rejected_reason: "打断编辑流"
      - option: "全部内联"
        rejected_reason: "规则命中多页时拖慢渲染、淹没表单"
    status: RESOLVED

  - node: Q10
    decision: "Data Dashboard 定位 = 混合（受管配置清单 + 折叠的受管标签页视图）"
    alternatives:
      - option: "只做按 tab 的统一视图"
        rejected_reason: "会丢失「我只想看我设置过什么」的定位"
      - option: "纯配置清单"
        rejected_reason: "rule 命中的页面看不到"
    status: RESOLVED

  - node: Q11
    decision: "取消 mode='manual'；规则一律参与链，仅 enabled 控制开关；删除 PageRule.mode 与 RuleMode"
    rationale: "manual 目前不可见地永不生效，属「改了不生效」同族；取消后「规则=生效的改写，enabled=开关」一名一义"
    status: RESOLVED

  - node: Q12
    decision: "保存覆盖维持非对称（快捷键 Confirm / 侧边栏静默+UndoBar），升格为有意设计"
    status: RESOLVED

  - node: Q13
    decision: "收敛为共享编辑件 + 删除孤儿（RuleEditor.tsx / DualCards.tsx 及其专属测试）"
    note: "title 链与 icon 链独立，不共享"
    status: RESOLVED

  - node: Q14
    decision: "site 节点的值来源 = 内容脚本回报站点原值，存 local 临时记录；未捕获显示 —"
    alternatives:
      - option: "读 tab.title"
        rejected_reason: "自证循环：显示的是我们自己的改写"
      - option: "不展示 site 节点"
        rejected_reason: "答不出「全部清除后我会看到什么」"
    status: RESOLVED

# ─────────────────────────────────────────────────────────────────────────────
constraint:
  - node: C1
    decision: "权限零扩张（不新增 permission / host_permission / command）"
    status: RESOLVED

  - node: C2
    decision: "内容脚本为投递的唯一实现；executeScript 退化为仅 apply 的最小兜底"
    rationale: "Q6 的页面作用域快照只能活在常驻上下文里"
    implications: "消除现状「主路径 executeScript / fallback sendMessage」的能力集不同"
    status: RESOLVED

  - node: C3
    decision: "有界重试 7 次（1/2/3/5/10/20/30s）；超限降级 + 标 degraded（仅内存）"
    status: RESOLVED

  - node: C4
    decision: "同 tab 合流最新一次；编辑 ~300ms 防抖；重试队列每 tab 唯一"
    alternatives:
      - option: "全部立即执行"
        rejected_reason: "规则命中 40 页时放大到 40×7 在途任务，且旧值可能覆盖新值"
      - option: "全局串行队列"
        rejected_reason: "最终值可能被旧值覆盖，危险"
    status: RESOLVED

  - node: C5
    decision: "受保护页判定集中在投递入口；受保护页不投递 + delivery='protected'；edit 仍允许"
    status: RESOLVED

  - node: C6
    decision: "siteSnapshot 严格封闭（只存 local，不进 sync/导出/诊断；字段仅 {title, faviconHref}；只读；tab 关闭丢弃）"
    alternatives:
      - option: "仅内存"
        rejected_reason: "MV3 SW 约 30s 空闲即可能回收 → site 节点会频繁显示 —"
    status: RESOLVED

  - node: C7
    decision: "既有测试处置 = 完全自由重写（用户裁决）+ 显式登记 RK-1"
    status: RESOLVED
    depends_on: [RK-1]

  - node: C8
    decision: "工程基线：不新增依赖；lint delta-0；typecheck 0；三浏览器 build；界面统一英文；WCAG 2.1 AA"
    status: RESOLVED

  - node: RK-1
    type: risk
    decision: "登记风险：核心解析语义与投递协议同时重构，行为漂移失去完整证据"
    mitigation: "field-chain.ts 保留独立穷举单测；计划中显式携带本风险；交付前补「链优先级前后等价」对照用例"
    status: RESOLVED

# ─────────────────────────────────────────────────────────────────────────────
architecture:
  - node: A1
    decision: "src/shared/field-chain.ts 纯函数；title 与 icon 各调用一次；链序 override > slot > rule > site"
    implications: "一处实现 ⇒ 视图显示值 = 实际投递值成为构造保证"
    status: RESOLVED

  - node: A1-bis
    decision: "「设定值」判定：undefined / null / '' 一律未设定；「清除」= 写回未设定，无需 tombstone"
    note: "两条清除作用域：本层清除（回落下一层） / 整链清除（本层+其下所有层，直达 site）"
    status: RESOLVED

  - node: A2
    decision: "新建 src/background/field-delivery-service.ts 作为唯一投递协调者（注入 Rule/Slot/Repo/Adapter）"
    alternatives:
      - option: "放 RuleService 内并自行解析 slot→tabId"
        rejected_reason: "造服务环或迫使 resolveSwitch 上移 shared"
    status: RESOLVED

  - node: A3
    decision: "受影响集合按维度：override 唯一 tabId / slot binding 或 resolveSwitch 推算 / rule 多命中"
    status: RESOLVED

  - node: A4
    decision: "逐字段三态指令 set / restore / none；协议层不可表达「清空」"
    status: RESOLVED

  - node: A4-bis
    decision: "restore 覆盖「整链清除后 site 亦无值」；本层清除落回 set 或 restore，共用同一协议"
    status: RESOLVED

  - node: A5
    decision: "单一入口 + leading/trailing 调度；删除 force"
    implications: "修掉侦察 #11（无按-tab 排序），保证最后一次编辑必然生效"
    status: RESOLVED

  - node: A6
    decision: "内容脚本为唯一实现 + 兜底；降级呈现 Limited: can't restore the site value"
    status: RESOLVED

  - node: A7
    decision: "siteSnapshot 首次改写前惰性捕获；每次导航重新捕获；链不再改写丢弃；扩展重载保留"
    status: RESOLVED

  - node: A8
    decision: "isProtectedUrl 只在投递入口判定一次；移除三处分散判定"
    status: RESOLVED

  - node: A9
    decision: "契约清理：删 PageRule.mode / RuleMode / APPLY_RULE_TO_TAB / GET_CANDIDATES / 每 URL guard"
    status: RESOLVED

  - node: A10
    decision: "GET_DASHBOARD → DashboardRow[]（kind override|slot|rule-hit，含 chain 与 delivery，anchor 承载跳焦）"
    status: RESOLVED

  - node: A11
    decision: "消息清单：新增 FIELD_APPLY / SITE_SNAPSHOT_REPORT；GET_DASHBOARD 重塑；CREATE/UPDATE_RULE 去 mode"
    status: RESOLVED

  - node: A12
    decision: "模块结构（含深挖②③ 新增：field-editor / rule-form-fields / undo-bar / empty-state / use-expand-row）"
    status: RESOLVED

