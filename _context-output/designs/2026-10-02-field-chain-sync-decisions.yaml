# ─────────────────────────────────────────────────────────────────────────────
detail:
  - node: DT1
    decision: "侧边栏入口处置 = 就地弹窗 + 与设置页共用同一实现（B）"
    rationale: "① 侧边栏核心价值是「看着当前页直接建规则」；② 共用实现已把分叉风险降到最低；③ 能力不等会制造新的不一致"
    implications: "靠构造保证一致（单一组件/单一校验/单一影响面）；字段集差异只能用显式 props/variant 表达"
    status: RESOLVED

  - node: DT2
    decision: "命名统一以侧边栏显式命名为准（Icon URL / Custom Icon / Use chain）"
    alternatives:
      - option: "统一为 URL / Custom"
        rejected_reason: "过于笼统，且与字段标签 Icon (optional) 不同族"
    status: RESOLVED

  - node: DT3
    decision: "Icon 选项重设计：第三项由 Reset 改为 Use chain"
    rationale: "现状把站点 favicon（http(s)）塞进 dataUri 并误标为 Custom Icon；Reset 的「—」提示属术语错位"
    status: RESOLVED

  - node: DT4
    decision: "预填 = 四项全部带入上下文（Match URL / Match Type / Title / Icon）；来源统一为链；打开时快照一次"
    status: RESOLVED

  - node: DT5
    decision: "Custom Title 与 Icon 对称支持 Use chain；对称 = 同一控件形状 + 同一术语 + 同一语义（非项数相同）"
    implications: "S4 的 value 须改为统一模式模型"
    status: RESOLVED

  - node: DT6
    decision: "Use chain 写侧语义 = A1（本层不设值 → 回落）"
    alternatives:
      - option: "A2 真哨兵钉住站点原值"
        rejected_reason: "图标值域是 URI 字符串，无法表达哨兵"
