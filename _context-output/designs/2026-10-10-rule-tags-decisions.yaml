decisions:

  # ─── 🔍 Goal ──────────────────────────────────────────────────────────────

  - layer: goal
    node: G1-tag-semantics
    decision: A — 纯组织标签（不影响匹配 / 优先级 / 启用；执行行为零变化）
    alternatives:
      - option: B — 组织标签 + 批量操作入口
        rejected_reason: 数据模型成本为零（string[] + 循环写入）⇒ 推迟代价极低；先做则须同期设计覆盖/新增/移除语义、确认与撤销
      - option: C — 标签即分组实体
        rejected_reason: 为一个「找到规则」的需求引入引用完整性、重命名传播、删除语义、孤儿引用子系统
      - option: D — 标签参与行为
        rejected_reason: 使「改标签」与「切换行为变化」耦合，产生不可解释缺陷
    rationale: 痛点在「找到」规则，不在规则行为
    implications: 标签为惰性数据，不进 field-chain / selectWinningRule / 投递路径
    status: RESOLVED
    depends_on: []

  - layer: goal
    node: G2-scale
    decision: B — 按 50–300 条规则、几十个标签设计界面；不写死上限
    alternatives:
      - option: A — ≤50 条
        rejected_reason: 与「管理更多的规则」自述不符，控件会过于简陋
      - option: C — 300+ 条
        rejected_reason: 虚拟化与标签命名空间只有真到量级才付得起；推迟成本为零
      - option: D — 不确定
        rejected_reason: 与 B 产出相同但缺少 UI 设计依据
    rationale: 遵循「能长大」但不预付代价
    implications: 需考虑标签呈现方式与每标签规则计数；不引入虚拟化与层级标签
    status: RESOLVED
    depends_on: []

  - layer: goal
    node: G3-tagging-entry
    decision: B — 新建时 + 单条编辑时（含清空）
    alternatives:
      - option: A — 仅新建时
        rejected_reason: 存量规则永无标签 ⇒ 标签筛选对其恒为空，特性「看起来做完但用不了」
      - option: C — 加批量赋值
        rejected_reason: 推迟代价极低，抓手（Rules 页批量操作栏）已存在
      - option: D — C + 从筛选结果反推批量
        rejected_reason: 同上；可由 C 顺带覆盖
    rationale: B 是让标签筛选不落空的最低限度
    implications: 批量赋值登记为明确的下一步
    status: RESOLVED
    depends_on: [G1]

  - layer: goal
    node: G4-filter-semantics
    decision: D' — 用户可编辑布尔表达式（AND / OR / NOT / 括号优先级）
    alternatives:
      - option: A — 单选一个标签
        rejected_reason: 无法表达「工作或紧急」「除归档外」
      - option: B — 多选 AND
        rejected_reason: 选中 3 个常得空列表 ⇒ 用户误判「标签没打上」；空结果是最易失信的模式
      - option: C — 多选 OR
        rejected_reason: 只能放宽不能收窄，无法表达 work AND urgent
    rationale: 用户明确要求运算符与括号优先级
    implications: 需要自研表达式引擎（AST + 解析 + 求值）；本迭代主要复杂度来源
    status: RESOLVED
    depends_on: [G1, G3]

  - layer: goal
    node: G5-expression-input
    decision: 结构化 chip 构建器 + 自研解析器；无自由文本表达式
    alternatives:
      - option: A — 纯文本输入 + 解析器
        rejected_reason: 用户需自行书写语法；非法字符与拼错运算符成为一整类错误状态
      - option: C — 文本 + 宿主求值器（new Function）
        rejected_reason: 把语义交给宿主语言，校验缺口即任意代码执行；项目零第三方依赖
      - option: D — 文本 + 结构化混用（双向）
        rejected_reason: AST→文本 方向最贵（加括号不得改变语义）；可点选的收益已由 chip 构建器更低成本取得
    rationale: chip 序列本身就是 token 流 ⇒ 分词器不再是必需项
    implications: 框内文本仅用于筛选候选；解析器仍负责优先级/括号配对/元数校验
    status: RESOLVED
    depends_on: [G4]

  - layer: goal
    node: G6-variable-scope
    decision: A — 只有标签；标题/URL 仍由现有文字搜索框承担
    alternatives:
      - option: B — 标签 + 标题/URL 条件
        rejected_reason: chip 内出现自由文本 ⇒ 引号转义、匹配模式、第三类错误状态；把分类筛选升级为通用查询语言
      - option: C — 只有标签但预留 field/op/value 形状
        rejected_reason: 当前无第二个字段，预留形状会在模型与测试中长期常驻空维度
    rationale: 规则的身份是标签；两个控件语义互不干扰
    implications: 「不存在的标签」在结构上不可能出现；文字搜索零回归
    status: RESOLVED
    depends_on: [G5]

  # ─── 🔒 Constraint ────────────────────────────────────────────────────────

  - layer: constraint
    node: C0-capacity-boundary
    decision: A + C — 300 条为界面设计目标（不承担容量承诺）；但标签上限校验本次就做
    alternatives:
      - option: B — 按单条目容量把目标降到 40–60 条
        rejected_reason: 放弃 300 的界面目标
      - option: D — 拆 key 突破 8KB
        rejected_reason: 破坏「单条目原子写 + configVersion 乐观锁」的现有一致性基础，代价远超本次收益
    rationale: |
      storage-repository.ts:37 SYNC_KEY 单条目；QUOTA_BYTES_PER_ITEM = 8192。
      单条 PageRule ≈ 170–200B ⇒ 约 40 条即到顶；加标签后 300 条必然超限。
      容量问题是先存问题，标签只是让它更早暴露。
    implications: 容量问题单独立项；tags 必须有上限校验（用户可无限增长的字段）
    status: RESOLVED
    depends_on: [G2]

  - layer: constraint
    node: C1-storage-encoding
    decision: B — 全局标签表 + 规则存 id；TagDefinition = { id, name, backgroundColor, textColor }
    alternatives:
      - option: A — 每条规则直接存标签名
        rejected_reason: 重命名需遍历改写；容量 300×35B ≈10KB vs 全局表 ≈1.2KB；无法表达孤立标签
      - option: (原) 仅 { id, name }
        rejected_reason: 建模不完整——用户补充标签还有背景色/文字颜色属性 【S1 回溯修订】
    rationale: 管理界面使重命名成为必须正确的能力；跨系统复用要求实体定义在共享层
    implications: 重命名 O(1)；删除须清理引用；导出必须同时携带标签表
    status: RESOLVED
    depends_on: [C0]

  - layer: constraint
    node: C2-name-normalization
    decision: B — 仅 trim 首尾空格，名称区分大小写（Work ≠ work，都出现在候选里）
    alternatives:
      - option: A — 原样保存
        rejected_reason: 保留 work 与 " work " 并存 ⇒ 真正的重复条目
      - option: C — 大小写不敏感去重、保留首次写法
        rejected_reason: 抹掉用户的排版二次判断；需定义「首次写法」权威来源
      - option: D — 统一归一为小写
        rejected_reason: 强行抹掉 Work / API / TODO 的排版意图，可读性下降
    rationale: 唯一性判定 = trim 后逐字节相等；颜色不参与身份判定
    implications: 写入与导入路径各校验一次
    status: RESOLVED
    depends_on: [C1]

  - layer: constraint
    node: C3-limits
    decision: 每条规则 ≤8 个标签；标签名 ≤32 字符；标签总数不限
    alternatives:
      - option: 含总数上限（100 / 200）
        rejected_reason: 用户明确选择总数不限
    rationale: 名字长度是唯一真正的字节预算入口；8 个已远超「少量标签做粗分类」的真实用法
    implications: |
      总数不限 ⇒ 标签会自然累积，使两件事成为必需：
      (1) 候选列表必须可搜索；(2) Tags 页必须能看见孤立标签
    status: RESOLVED
    depends_on: [C0, C1]

  - layer: constraint
    node: C4-delete-semantics
    decision: B — 级联移除 + 明确告知影响数（确认框报「将被 N 条规则摘除」）
    alternatives:
      - option: A — 阻止删除
        rejected_reason: 300 条下惩罚性，与「管理界面」存在意义相反
      - option: C — 软删除/归档
        rejected_reason: 引入第三态，每处读取都要处理「归档中」分支
      - option: D — 允许悬空引用
        rejected_reason: 「未知标签」渲染分支常驻 UI，且筛选需定义引用未知物的语义
    rationale: 与 Data Dashboard 的破坏性批量清理先例一致
    implications: 删除是破坏性但可撤销；O7「悬空谓词」由此对规则侧闭合
    status: RESOLVED
    depends_on: [C1]

  - layer: constraint
    node: C5-delete-undo
    decision: B — 复用现有 UndoBar（原子批量快照：标签实体 + 被摘除的全部引用，5s）
    alternatives:
      - option: A — 不要撤销
        rejected_reason: 危害严格大于既有 Clear（破坏散落在 N 条规则上的引用，且规则仍在、静默失去筛选命中）
      - option: C — 长时限（24h）兜底
        rejected_reason: 需持久化通道与清理/过期语义，把后悔药变成存储特性
    rationale: 更危险的 Clear 已有撤销；机制现成
    implications: 沿用既有 g2 裁决——Confirm 关闭 → 提交 → 再弹 UndoBar（串行）
    status: RESOLVED
    depends_on: [C4]

  - layer: constraint
    node: C6-incomplete-expression
    decision: A — 解析不成功一律视为「未筛选」（显示全部）+ 框边轻提示
    alternatives:
      - option: B — 只应用已完整部分
        rejected_reason: 最糟——让 AND 成为看起来生效、实际被忽略的控件
      - option: C — 冻结上一次有效结果
        rejected_reason: 半成品是正常输入路径的一部分，惩罚它会让每次点选都看到列表冻结
      - option: D — 清空列表并报错
        rejected_reason: 把「编辑到一半」惩罚成「什么都看不见」
    rationale: 半成品是正常路径而非错误；失败模式最温和且自我解释
    implications: 确定性规则——只有解析成功的表达式才作用于列表
    status: RESOLVED
    depends_on: [G5]

  - layer: constraint
    node: C7-deleted-tag-in-expression
    decision: C — 保留 chip，整个表达式暂停生效 + 点名提示
    alternatives:
      - option: A — 自动摘除 chip 并重新规范化
        rejected_reason: 用户已构建的筛选条件被静默改写
      - option: B — 保留 chip 且仍可求值（谓词恒假）
        rejected_reason: 表达式语法完全正常却静默变空——最难排查的「明明有规则却筛不出来」
      - option: D — 清空整个表达式
        rejected_reason: 删一个不相关标签会清掉全部筛选条件
    rationale: 删除标签的副作用不应扩散成「筛选器停摆」
    implications: 推导出 D2——chip 必须自带「插入时的名字」作为显示后备
    status: RESOLVED
    depends_on: [C4, C6]

  - layer: constraint
    node: C8-expression-unbounded
    decision: A — 表达式不设上限
    alternatives:
      - option: B — 软上限（提示复杂）
        rejected_reason: 看起来有约束、实际没有；问题在构造过程中已产生
      - option: C — 硬上限（16 谓词 / 4 层嵌套）
        rejected_reason: 用户选择完全信任
      - option: D — 硬上限 + 引导
        rejected_reason: 越界瞬间给「改造思维」的建议成本高且居高临下
    rationale: 表达式是 UI 态、不落盘、不占字节预算
    implications: 推导出 D1——解析与求值不得因深度崩溃（须迭代实现）
    status: RESOLVED
    depends_on: [C6]

  - layer: constraint
    node: C9-compat-posture
    decision: 不承担向后兼容（项目未上线，开发阶段）——即「不写迁移分支」，而非「读取必须严格」
    alternatives:
      - option: 宽容读取旧存档
        rejected_reason: 沿 import-export G1 同一立场，开发阶段无历史数据需兼容
    rationale: |
      沿用既有裁决。含义经 2026-10-11 计划审查修订（原措辞「存档缺 tags ⇒ 视为损坏并拒绝」
      与 storage-repository.ts:252-261 migrateSyncState 的既有统一形态冲突）。
    implications: |
      ① 本机读取：宽容补齐（顶层 ?? [] + 规则级补 tagIds: []），与既有 6 个顶层字段同形，不写迁移分支；
      ② 导入包：严格（标签字段必填，缺失即失败）——严格性只施加于包；
      ③ 表达式不持久化（UI 态）；
      ④ 「引用的标签已不存在」不可能来自存档，只可能来自会话内删除
    status: RESOLVED
    depends_on: []
    revised:
      at: 2026-10-11
      reason: |
        计划审查发现原 ①「视为损坏并拒绝」与 migrateSyncState 的 ?? 兜底形态冲突，
        且与 ② 混为一谈。修订为「本机宽容 / 包严格」分层。
        migrateSyncState 对每个顶层字段都 ?? 兜底且不做规则级深规范化 ⇒ 缺 tagIds 的规则
        运行时为 undefined 而 TS 声称 string[]（类型谎言），必须补 [] 。

  - layer: constraint
    node: D1-no-depth-crash
    decision: 解析与求值不得因输入深度崩溃（迭代实现 / 深度保护）
    alternatives: []
    rationale: C8 无上限 ⇒ 深嵌套可能来自被破坏的存档；爆栈后果是设置页白屏而非报错
    implications: 落点 src/shared/tag-expression.ts；实现层不变量，非 UI 上限
    status: RESOLVED
    depends_on: [C8]

  - layer: constraint
    node: D2-chip-name-fallback
    decision: chip 必须自带「插入时的名字」作为显示后备
    alternatives: []
    rationale: C7 要求点名提示，但实体已删则表里查不到名字
    implications: 显示优先级：活表名字（重命名自动跟随）→ 后备名（已删）；无需墓碑记录
    status: RESOLVED
    depends_on: [C7]

  - layer: constraint
    node: D3-strip-dangling-ids
    decision: 写入路径须在持久化前剥离悬空 tag id
    alternatives: []
    rationale: C1 的 id 引用 + C4 的级联删除 ⇒ 任意写入路径漏清即悬空
    implications: 落点 TagService 写入路径（不可依赖 RuleService）；先例 storage-repository.ts:158
    status: RESOLVED
    depends_on: [C1, C4]

  - layer: constraint
    node: D4-diagnostics-no-tag-names
    decision: 诊断信息不得含标签名
    alternatives: []
    rationale: 沿用既有 sanitized 契约（diagnostics-service.ts:75 显式断言不含 URL/title）
    implications: 标签名与页面标题同级敏感
    status: RESOLVED
    depends_on: []

  # ─── 🏗️ Architecture ─────────────────────────────────────────────────────

  - layer: architecture
    node: A1-service-boundary
    decision: B — 独立 TagService + 独立消息族；RuleService 不感知标签表
    alternatives:
      - option: A — 扩展 RuleService 与现有消息
        rejected_reason: 改标签会经过 applyToMatchingTabs ⇒ 把「标签不影响行为」从结构约束降级为巧合
      - option: C — StorageRepository 直接暴露方法
        rejected_reason: 把业务规则（上限/去重/级联）下沉到存储层，破坏其纯搬运分工
      - option: D — B + 谓词求值也归 TagService
        rejected_reason: 纯函数放进背景层会把同步计算变成消息往返，明确性能倒退
    rationale: 「其他系统也会用到 tag」依赖的正是这条边界
    implications: |
      「标签不影响行为」由模块边界保证（A-a）；
      PageRule.tagIds 对 RuleService 是透明数据 ⇒ D3 落点必须在 TagService
    status: RESOLVED
    depends_on: [G1, C1]

  - layer: architecture
    node: A2-expression-location
    decision: C — src/shared/tag-expression.ts 纯模块，含实体解析
    alternatives:
      - option: A — src/ui/shared/
        rejected_reason: AST 类型不对外暴露，「其他系统复用」退化为重写解析
      - option: B — 仅纯语法层下沉
        rejected_reason: 边界画错——chip 存名字、规则存 id，求值必然需要标签表做名字↔id 解析
      - option: D — 实现与类型分处两地
        rejected_reason: 类型与实现是同一契约的两半，分开只会改一处忘另一处
    rationale: 「标签名 → 规则子集」成为可复用的共享纯函数
    implications: 可用 vitest --project unit 纯函数穷举单测；D1 在此获得最佳覆盖
    status: RESOLVED
    depends_on: [A1, C1, G6, D1]

  - layer: architecture
    node: A3-package-shape
    decision: 根级 tags 表 + PortableRule.tags（内联名字）
    alternatives:
      - option: A — 与 SyncState 1:1 镜像（两侧都带 id）
        rejected_reason: 包内规则用名、表用 id 两套身份并用；自洽校验退化为两件事
      - option: C — 规则内联名、包内不设标签表
        rejected_reason: 无词汇表承载对象 ⇒「哪些标签作为实体被携带」不可表达
      - option: D — 宽容导入（静默丢弃悬空 id）
        rejected_reason: 导入部分成功且无提示；与 import-export 全力消灭静默降级的立场相反
    rationale: 用户方案在导出侧就消灭不自洽 ⇒ 落盘文件恒自洽，导入侧保持严格姿态
    implications: |
      RULE_KEYS 必须新增 tags（as const satisfies ⇒ 编译期强制）；
      新增第 5 个导出维度（S5）；自洽判定 = 一行集合差集
    status: RESOLVED
    depends_on: [C1, C2, C9]

  - layer: architecture
    node: A4-package-tag-entry
    decision: C' — 根级表携带实体（{name, backgroundColor, textColor}），仍不携带 id；规则内联名字
    alternatives:
      - option: (原) string[] 仅名字
        rejected_reason: C1 扩展出颜色后，仅名字的词汇表传不了颜色 【S2 回溯修订】
      - option: A — {id,name}[]，按名字查找/新建
        rejected_reason: 镜像收益是假的——id 在本机存在只因为规则存 id
      - option: B — {id,name}[] 保留源 id
        rejected_reason: 需 id 空间冲突与重映射策略，而两套 id 无语义关联
    rationale: 用户论据——目标机已有自己的一套标签 id，包内 id 无用，导入时必须重算
    implications: 导入侧名字→本地 id，按 trim 逐字节相等匹配；命中复用、未命中新建；无 id 协商
    status: RESOLVED
    depends_on: [A3, C1, C2]

  - layer: architecture
    node: A5-dimension-granularity
    decision: B — 逐标签勾选；导出前弹窗（补足最小集 / 丢弃悬空 tags）
    alternatives:
      - option: A — 维度级开关（全带/全不带）
        rejected_reason: 保证包恒自洽 ⇒ 弹窗成为永不触发的死代码
      - option: C — 逐标签勾选但禁用正在被使用的标签
        rejected_reason: 把选择权收走；「只分享规则结构、不带标签分类」的合理意图无法表达
      - option: D — B + 勾选阶段实时显示影响
        rejected_reason: 有价值但可选；用户明确要的是导出时弹窗；不需改协议，可后加
    rationale: 用户的诉求正是让弹窗存在
    implications: 两个选项与集合差集一一对应，无第三态；两条出路均为纯数据操作
    status: RESOLVED
    depends_on: [A3]

  - layer: architecture
    node: A6-tagids-direction
    decision: A — 规则存 id（PageRule.tagIds）+ 标签表只有实体；反向查询遍历规则
    alternatives:
      - option: B — 标签表存 ruleIds
        rejected_reason: |
          ① 方向反了——规则行渲染是最高频读取，B 让它变成遍历；
          ② 破坏 A1 的模块边界——删规则走 RuleService，而它按 A1 不感知标签表
      - option: C — 双向都存
        rejected_reason: 一致性维护须覆盖创建/更新/删除/导入四条路径，任一遗漏即静默不一致
      - option: D — A + 惰性反向索引
        rejected_reason: 解决的是反查变慢，而标签数在几十量级下不严重；可后续优化且不改数据模型
    rationale: 引用方向使 A 成为唯一不需维护一致性的选项
    implications: 反查（C4 删除影响数、C3 孤立标签）由 TagService 遍历 rules 得出，不越界
    status: RESOLVED
    depends_on: [A1, C1, C4]

  - layer: architecture
    node: A7-tags-dimension-mode
    decision: B — tags 提供 incremental / overwrite；overwrite 的删除在导入侧可由用户改判
    alternatives:
      - option: A — 不提供模式（合并语义恒为按名字合并）
        rejected_reason: 该建议的前提「标签只有名字」已被 C1 修订推翻 【S4 回溯修订】
      - option: C — 提供模式但 overwrite 仅作用于文件涉及的标签
        rejected_reason: 与 A 实际效果相同却多一个控件；该控件唯一作用是让用户以为在做选择
    rationale: 标签带颜色 ⇒ overwrite 带来的是「我这一套标签的视觉方案」而不仅是名字
    implications: |
      硬约束：overwrite 会删除标签 ⇒ 导入 diff 必须披露「N 个标签将被删除、M 条规则将失去标签」，
      不得绕过 C4 的告知保护
    status: RESOLVED
    depends_on: [A4, C1, C4]

  - layer: architecture
    node: A8-overwrite-delete-scope
    decision: 让用户选择：级联摘除全部引用 / 转成 incremental（即不删除标签）
    alternatives:
      - option: A — 级联摘除全部引用（无选择，硬行为）
        rejected_reason: 让「同步外观」能静默摧毁数据结构，绕过 C4 的告知与确认
      - option: B — 只删除未被引用的标签，被引用者保留并更新颜色
        rejected_reason: 用户选择让用户决定；B 的自动判断缺少用户意图的输入
      - option: C — 全部删除，被引用者转软删除
        rejected_reason: 引入第三态（已由 C4 否决过同类）
      - option: D — 逐标签决定保留/删除
        rejected_reason: 把一次「同步外观」变成逐项审批；且绕开 C4 的 Confirm
    rationale: 「同步外观」与「清空标签体系」是两件事，选择权交用户
    implications: 等价于改写 ImportIntent.dimensionModes.tags，diff 与确认框重新渲染
    status: RESOLVED
    depends_on: [A7, C4]

  - layer: architecture
    node: A9-import-inconsistency-handling
    decision: 导入侧遇「规则与标签不自洽」时同样弹窗：补足最小集 / 丢弃悬空 tags
    alternatives: []
    rationale: 与导出侧共用一组选项；语义不自洽改为显式让用户裁决
    implications: C9 的严格性限定在 schema/版本；语义不自洽不再静默拒绝
    status: RESOLVED
    depends_on: [A3, A5, C9]

  - layer: architecture
    node: A10-dangling-name-default-appearance
    decision: A — 悬空名字「文件没有、本机也没有」时以默认外观创建，并在导入结果报出数量
    alternatives:
      - option: B — 导入侧不提供「补足」，只提供「丢弃」
        rejected_reason: 规则的可引用性是第一位；丢弃使那些规则永久失去标签
      - option: C — 默认外观 + 标记「外观未设置」在 Tags 页突出
        rejected_reason: 引入第三态，每个渲染标签处都要分支（C4 已否决同类）
      - option: D — 阻止导入，要求文件侧修正
        rejected_reason: 把可自动收敛的问题退化成失败的导入；信息已足够做出合理决定
    rationale: 结构完整优先；外观是可后续修正的次要属性
    implications: |
      悬空名字先按名字查目标机标签表（A-e），命中则复用本机颜色；
      未命中才以默认外观创建并披露数量。
      与导出侧的补足构成「有据的不对称」（导入侧无颜色来源）
    status: RESOLVED
    depends_on: [A4, A9]

  # ─── 📐 Detail ────────────────────────────────────────────────────────────

  - layer: detail
    node: D0-tags-as-fifth-dimension
    decision: A — tags 为独立第 5 维度，同步 4 处模型
    alternatives:
      - option: B — rules 维度的子选项
        rejected_reason: 「单独导出 tags、不带任何规则」无法表达，而 tags 无处安放
      - option: C — 独立维度但 UI 并入 rules 卡片
        rejected_reason: 省下的只是 UI 位置，却让「维度 5 个、卡片 4 张」的不一致常驻
    rationale: 用户原话为「新增 tags 项」；补偿事实——DimensionPresence 必填 ⇒ 逐处编译报错不会漏
    implications: ExportScope/DimensionPresence/DimensionMode/ImportDimensionOutcomes 各增 tags；DIMENSION_LABELS/META 增项
    status: RESOLVED
    depends_on: [A3]

  - layer: detail
    node: D-a-tags-page
    decision: A — 新增顶级导航项「Tags」（第 7 个 section，完整页面）
    alternatives:
      - option: B — Rules 页内可展开面板
        rejected_reason: 删除标签影响跨规则，局部容器看不到全局视图
      - option: C — 从 Rules 页打开的 Dialog
        rejected_reason: 同 B；且删除影响数需在模态里额外陈述。可接受次选
      - option: D — 挂在 Data Dashboard 之下
        rejected_reason: 语义错配——Dashboard 管理链的结果，标签是组织维度
    rationale: 用户要求「单独给 tag 一个管理界面」且强调跨系统复用
    implications: 导航略长（低频操作）；该页须能看见孤立标签（C3）
    status: RESOLVED
    depends_on: [C3, C4]

  - layer: detail
    node: D-b-inline-create
    decision: A — chip 输入框可就地新建（回车即建并选中）
    alternatives:
      - option: B — 只能选已有
        rejected_reason: 把高频路径变成三段式（离开→建→返回）；C3 总数不限 ⇒ 新建是常规动作
      - option: C — 就地新建 + 二次确认
        rejected_reason: 新建完全可逆（删除即可，且有撤销）；为可逆操作加确认会训练无脑确认
      - option: D — 建后立即进入重命名
        rejected_reason: 用户输入的名字通常就是最终名字，强制改名反而打断
    rationale: A 与 Tags 页互补——后者面向批量查看/重命名/删除
    implications: 必须走同一条 TagService 写入路径（A1）
    status: RESOLVED
    depends_on: [A1, C2, C3]

  - layer: detail
    node: D-c-tags-column
    decision: C — 新增独立 Tags 列 + 默认收起（⊘ 开关切换）
    alternatives:
      - option: A — 新增列并始终显示
        rejected_reason: 8 个标签会挤掉 URL Pattern 列——本表信息密度最高的一列
      - option: B — 并入 Title 列
        rejected_reason: 归属错误——标签不是标题的从属信息，挂在标题下会持续暗示「标题的属性」
      - option: D — 不显示，仅作筛选依据
        rejected_reason: 筛选后用户必须能验证「为什么这条被选中」；看不见标签等于结果不可核对
    rationale: 复用既有 ⊘ 控件先例，不引入新交互模式
    implications: 「默认收起」= 列默认不渲染；打标反馈由 Tags 页与行内编辑器承担
    status: RESOLVED
    depends_on: [G2]

  - layer: detail
    node: D-d-expression-wrapping
    decision: 框体自动折行增高，高度随内容增长（不设行数上限、不转内部滚动）
    alternatives:
      - option: A — 定高 + 内部横向滚动
        rejected_reason: 横向滚动使表达式失去可扫读性，而扫读是 chip 方案相对文本的唯一优势
      - option: C — 定高多行 + 内部纵向滚动
        rejected_reason: 高度恒定——多数表达式 1–2 行，固定 3 行会在常见情况空出两行
      - option: D — 超阈值降级为「N 个条件」摘要
        rejected_reason: 引入两套渲染；摘要在需要核对结构时恰好把结构藏了
    rationale: 与 D1 分工——D1 管不崩（实现层），本条管可读（呈现层）
    implications: 呈现层不做任何截断；登记的代价：极端情况下工具栏被推出视口（可见且可理解）
    status: RESOLVED
    depends_on: [C8, D1]

  - layer: detail
    node: D-e-dialog-copy
    decision: B — 后果式措辞（补足：包内将包含 N 个额外的「x」「y」标签定义 / 丢弃：M 条规则将丢失「x」「y」标签）
    alternatives:
      - option: A — 陈述式
        rejected_reason: 未说出「收件方会多拿到 N 个标签定义」——而它影响对方机器
      - option: C — 极简式（补足 / 丢弃 + 一行说明）
        rejected_reason: 两个词无法让用户预判后果，等于让他猜
      - option: D — B + 默认高亮「补足」
        rejected_reason: Enter 触发默认按钮 ⇒ 一次误触就往别人配置里多塞标签；两个选项应等权
    rationale: 与项目一贯立场一致——把「即将发生什么」在操作前说清
    implications: 文案中的数字与名字直接渲染集合差集，与判定同源不漂移
    status: RESOLVED
    depends_on: [A5]

  - layer: detail
    node: D-f-inline-create-lifecycle
    decision: 标签立即创建并落盘；取消规则表单则标签留下（可能成为孤立标签）
    alternatives:
      - option: 「标签实体与引用同一次操作完成」
        rejected_reason: |
          自相矛盾——规则表单在保存前只是本地 state，CREATE_TAG 是独立服务端写入，
          两者无法同一笔事务完成；补救只有「推迟创建」，那会让「回车即建即选中」变成假承诺
      - option: 引入「草稿标签」第三态
        rejected_reason: 会派生出「引用一个尚未落盘的标签」这类悬空，与 C7/D3 冲突
    rationale: 孤立标签是 C3 已接受的后果，且 Tags 页必须能看见它
    implications: 就地新建必须走同一条 TagService 写入路径
    status: RESOLVED
    depends_on: [D-b, C3]

  - layer: detail
    node: D-g-red-lines
    decision: 承自上游的红线在本层写实（非新决策）
    alternatives: []
    rationale: 避免实现期遗漏
    implications: |
      R1 D-13 选中项 prune 须扩展到新的筛选条件输入；
      R2 诊断不含标签名（D4）；
      R3 Confirm/UndoBar 串行（g2）；
      R4 破坏性操作不设默认按钮；
      R5 tags 维度与既有 4 维度同构（卡片/模式/计数/空态）；
      R6 chip 须可聚焦、可键盘删除、有可访问名称
    status: RESOLVED
    depends_on: [C5, D-e]

# ─── 回溯修订索引 ────────────────────────────────────────────────────────────

revisions:
  - id: S1
    at: detail-validation
    target: C1
    change: '{id,name} → {id,name,backgroundColor,textColor}；颜色不参与身份判定'
    reason: 用户补充「标签不只是有 name 属性，还有背景色、文字颜色等属性」
  - id: S2
    at: detail-validation
    target: A4
    change: '包内 string[] → PortableTag[]（仍不携带 id）；规则侧仍内联名字'
    reason: C1 扩展出颜色后，仅名字的词汇表传不了颜色
  - id: S3
    at: architecture
    target: A3/A5
    change: 导出侧消灭不自洽（落盘文件恒自洽）
    reason: 用户方案优于原建议（在用户有上下文处解决）——记录为已采纳
  - id: S4
    at: detail-validation
    target: A7(new)
    change: 'tags 提供 incremental/overwrite；该建议的 A 选项前提被推翻'
    reason: 标签带颜色 ⇒ overwrite 有真实内容（视觉方案），不再是「只有名字」的合并
  - id: S5
    at: detail
    target: D0(new)
    change: tags 为独立第 5 维度
    reason: 用户原话「新增 tags 项」；B/C 均有表达缺口或不一致
  - id: S6
    at: architecture
    target: A10(new)
    change: 导入侧悬空名字未命中 ⇒ 默认外观创建 + 结果披露数量
    reason: 导入侧无颜色来源（与导出侧构成有据的不对称）
  - id: S7
    at: plan-review
    target: C9-①
    change: 措辞「存档缺字段 ⇒ 视为损坏并拒绝」→「本机读取宽容补齐；严格性只施加于导入包」
    reason: |
      规划期高精度审查发现原措辞与 storage-repository.ts:252-261 migrateSyncState 的
      既有统一形态冲突（每个顶层字段都 ?? 兜底，且不做规则级深规范化）。
      「不兼容」的准确含义是不写迁移分支，而非读取必须严格。经用户批准（2026-10-11）修订。
      计划层 P2 由此与设计一致，不再是「计划覆盖设计」。