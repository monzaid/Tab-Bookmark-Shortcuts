decisions:

  # ─── 🔍 Goal ──────────────────────────────────────────────────────────────

  - layer: goal
    node: G1-scope
    decision: B + C 并做（修正错误语义 + 扩展能力），且不承担向后兼容
    alternatives:
      - option: 仅对齐设计权威
        rejected_reason: 只补一块已有砖，不修会静默损坏数据的语义
      - option: 仅修正语义
        rejected_reason: 会让"分享单条规则/槽位"名不副实
      - option: 仅扩展能力
        rejected_reason: 在静默损坏未修的前提下，扩展只会放大损害面
    rationale: 开发阶段无历史包需兼容；三处宽容读取（legacy 判别/静默纠正/可选字段）随之收紧
    implications: 版本不符严格拒绝；switchDirection 非法值拒绝而非纠正
    status: RESOLVED
    depends_on: []

  - layer: goal
    node: G2-package-model
    decision: 一个版本化的「可携带包」，全量与子集同构
    alternatives:
      - option: 仍为全量快照，只修语义
        rejected_reason: C（部分导出）会变成补丁，需额外定义规则是否随行
      - option: 拆成「备份」与「分享」两种产物
        rejected_reason: 两套 schema、两套校验、两套测试
    rationale: 合并语义只需定义一次；包自描述，可派生 diff/清单
    implications: 导出可勾选范围；导入按"文件里有什么就合并什么"
    status: RESOLVED
    depends_on: [G1-scope]

  - layer: goal
    node: G3-record-kinds
    decision: sync 层 + 可选「图标数据」附件（opt-in，默认关）
    alternatives:
      - option: 仅 sync 层
        rejected_reason: 使"分享单条规则/槽位"名不副实，接收方拿到占位且不知要重选
      - option: sync + 本地层附件
        rejected_reason: 抵触设计权威的图标同步边界；bindings/siteSnapshot 是设备会话语义
    rationale: 导出是用户显式触发的迁移/分享动作，与「同步」是不同边界
    implications: 需包内声明是否含图标数据（**后由 C1 取代**）
    status: SUPERSEDED
    superseded_by: C1-icon-carriage
    depends_on: [G2-package-model]
    note: 已被 C1 取代 —— 用户裁定「图标只支持导出 Icon URL / local-icon 路径 / Custom Icon 配方」，包内禁任何原始位图

  - layer: goal
    node: G4-success-criteria
    decision: 保真 + 可解释 + 可逆，三条全为硬指标，冲突时 B > A > C
    alternatives:
      - option: 单一判据
        rejected_reason: 三条互不替代，各自堵一类真实缺陷
    rationale: 保真堵静默替换；可解释堵用户不知情；可逆堵手滑即灾难
    implications: 三者可共用同一次解析结果
    status: RESOLVED
    depends_on: [G1-scope]
    revisions:
      - date: 2026-10-05
        change: 撤回「可逆」——不实现导入撤销
        effect: 取舍顺序变为 B > A；替代保障为「量化后果 + 可选备份 + 风险确认」

  - layer: goal
    node: G5-import-boundary
    decision: 文件驱动 + 显式「清空」指令
    alternatives:
      - option: 一律文件驱动
        rejected_reason: 无法表达"恢复成某个已知状态"的灾备诉求
      - option: 一律全量覆盖
        rejected_reason: 即现行 state.rules = preview.rules，是"保留现有却清空规则"缺陷的根源
    rationale: 两种意图都保留，但强制显式表达
    implications: diff 与快照规模可被用户预期
    status: RESOLVED
    depends_on: [G2-package-model]
    revisions:
      - date: 2026-10-05
        change: 精细化为「每维度一个增量/覆盖模式」（G5-refined）
        effect: 全局开关无法表达"槽位覆盖、规则保留"的组合

  # ─── 🔒 Constraint ────────────────────────────────────────────────────────

  - layer: constraint
    node: C1-icon-carriage
    decision: 包内禁止原始位图；只承载 Icon URL / local-icon 裸引用 / 可复现配方
    alternatives:
      - option: 始终附带 data URI
        rejected_reason: 单图标可达约 2.7MB（2MB 输入 × base64 膨胀），10 槽位约 27MB
      - option: 默认不附带、可 opt-in
        rejected_reason: 仍需承载位图与包内声明；URL 缓存应交由接收方建立
    rationale: URL 与配方都可复现；引用占位交由接收方重新选择，无需搬运字节
    implications:
      - 无需体积上限、无需 opt-in 开关
      - MAX_OUTPUT_SIZE（声明但从未执行）欠账作废
    revisions:
      - date: 2026-10-06
        change: T22 实施期澄清 —— missingIcons 口径 = 仅"不可解析的 local-icon 引用"（C9② 精确范围）
        effect: |
          实施 T22 时出现两种口径分歧，裁定如下：
          - **missing 仅指** `type:'upload' && value.startsWith(LOCAL_ICON_REF_PREFIX) && 解析为 null`
            （C9② 原文范围）⇒ 与 `IconService.resolveForDisplayState` 同源；
          - **`type:'url'` 不计入**：URL 可复现，其跨设备语义是「**接收方首次需要时建立本地缓存**」
            （本节点 rationale 原文）⇒ 若计入，**每台新设备一导入即满屏"需重选"**，把"可复现"
            误报为"缺失"。下载/重试路径已存在（`retryDownload` / `DOWNLOAD_ICON`）；
          - **`template`（配方）不计入**：可复现渲染；
          - **"从未设置"不计入**：`!source ⇒ missing:false`（D9 硬要求可区分）；
          - **判定对象 = `finalSafe`**（`applyIntent` 产物 = 本次写入的对象），**不是写前 `current`**：
            写前判会把 `replaced` 记录误判为 not-missing（其 blob 随后被 `keysToClear` 清掉）。
          - **收集点须在 `clearAndWriteWithCompensation` 之后**（`:409-417` 之后）：
            文件携带 `local-icon:icon:slot-3` 而**目标机 `local['icon:slot-3']` 可能持有目标机自己的
            blob** ⇒ 写前 probe 命中 ⇒ 误判 not-missing，而该 blob **即将被 `keysToClear` 清掉**
            （C10 正是要避免这种"假成功"）⇒ **写前判定会系统性欠报 `replaced`**。
            （"包内无位图 ⇒ 与清槽时机无关"**只对 `added` 成立** —— 这是实施期修正，
            reviewer 补上了"何时探"这一半。）
            必测 RED：**`replaced` + 文件 `local-ref` + 目标机该 key 有自有 blob ⇒ 须报 missing**
            （同时抓"写前判定"与"重写 if 链"两种错法）。
          - **实现须调用 `IconService.isMissingIcon`**，不得重写 if 链（否则新增第三处前缀消费）；
            且 `import-export-service.ts` 内**不得**出现 `resolveIconReference(`（单数）调用 ——
            该方法的调用点须仍仅 `icon-service.ts`（可机检）。
          - **`tolerant` 的字段 allowlist 须编译期耦合**：`as const satisfies Record<keyof PortableXxx, true>`
            ⇒ 给形状加字段而忘同步 ⇒ **类型错误**（裸字符串数组与**裸 `as const`** 均不达标，会静默漏检）。
            可行性已验：本仓库 `as const satisfies` 有多处先例（`worker-orchestrator.ts:107` 等）；
            `satisfies Record<keyof T, true>` 靠**编译期穷尽检查**、不依赖运行时类型反射；
            运行时数组用 `Object.keys(KEYS)` 取。
          - **allowlist 只列 root/slot/rule 三层**（`icon` 条目**删除**）：实现有意**不深走**
            `urlMatch`/`marker`/`icon` 内部 ⇒ 声明却不生效的键集会被误读为"icon 也被检"
            （"作者意图 vs 实现"漂移）。
          - **双落点防漂移断言**：同一 `parsed` 下，`inspect().tolerant` 与 apply 结果的 `tolerant`
            **同序同值**（行为型比较两个真实输出）。
        open_item: |
          记账（**非 T22 范围**）：新设备上 URL 图标的本地缓存**没有自动建立路径**
          （`resolveForDisplay` 明确 "does NOT trigger downloads"；`retryDownload` 仅由
          `DOWNLOAD_ICON` 动作触发）⇒ "首次需要时建立缓存"目前**无自动实现者**。
          属**导入路径之外**的既有缺口，另行跟踪。
      - 附带范围扩张：新增「Custom Icon 配方持久化」
    status: RESOLVED
    supersedes: G3-record-kinds
    depends_on: [G1-scope]

  - layer: constraint
    node: C2-export-deref
    decision: 导出必须解引用，且裸发引用（不得加 [local:…] 包装）
    alternatives:
      - option: 保留现有包装
        rejected_reason: "[local:local-icon:icon:slot-3] 首尾均不匹配 startsWith('local-icon:')，必然无法解析"
    rationale: 现网缺陷 —— 带包装的字符串永远解析不了，也不被识别为引用
    implications: URL 类直接导出 URL，不上引用
    status: RESOLVED
    depends_on: [C1-icon-carriage]

  - layer: constraint
    node: C3-atomicity
    decision: 严格原子 —— 预检全部通过才提交；单次配置写入；否则整体拒绝、零改动 + 定位原因 + 化解建议
    alternatives:
      - option: 尽力而为（部分成功）
        rejected_reason: 使判据 B（预览即合同）与 C（撤销=回到导入前）同时失效
      - option: 原子 + 配额降级通道
        rejected_reason: 把同一决策拆成两次勾选，违反"意图显式表达一次"
    rationale: 原子是"可逆"能成立的唯一干净前提
    implications: F4 并入 —— 提交必须绑定预览时确定的版本号
    status: RESOLVED
    depends_on: [G4-success-criteria]
    revisions:
      - date: 2026-10-05
        change: 第三个触发条件（记录非法）由「整体拒绝」放宽为「跳过该记录 + 披露」
        effect: 见 D15；安全等价性：不写入即无风险

  - layer: constraint
    node: C4-server-authority
    decision: 服务端重新推导 —— UI 只回传用户意图，服务端重算 diff 与预览比对，不符则拒绝；preview 仅展示
    alternatives:
      - option: 服务端缓存预览（token）
        rejected_reason: MV3 下 service worker 随时挂起，内存状态会丢
      - option: 维持 UI 回传完整 preview + 加强校验
        rejected_reason: 权威在客户端使判据 B 退化；且允许绕过"清空需显式勾选"
    rationale: 既有注释自证"preview may have been built by hand or mutated"
    implications: 包必须自描述（服务端仅凭「文件 + 意图」可重算）
    status: RESOLVED
    depends_on: [C3-atomicity]
    revisions:
      - date: 2026-10-05
        change: 文件漂移残余风险由 D12 构造性消除
        effect: 权威性与告知性同时得到保证

  - layer: constraint
    node: C5-snapshot-storage
    decision: 快照只存 storage.local，独立键 + 惰性 TTL，不设预设上限
    alternatives:
      - option: 明确容量上限 + 不满足则拒绝
        rejected_reason: 用户选择不预判体积
      - option: 允许存 sync
        rejected_reason: 违反 sync 语义边界与 8KB/键限制
    rationale: 复用以 lazy expiresAt 应对 MV3 挂起
    implications: 取消"预先按体积拒绝"
    status: VOID
    void_reason: 2026-10-05 不实现导入撤销
    depends_on: [G4-success-criteria]

  - layer: constraint
    node: C6-snapshot-failure
    decision: 快照写入失败时仍执行导入，但显式告知"本次不提供撤销"并由用户独立确认
    alternatives:
      - option: 拒绝执行导入
        rejected_reason: 把可逆抬到高于用户意图，与 G4 顺序不符
      - option: 先腾空间再重试
        rejected_reason: 会静默删除用户的图标缓存，把失败路径扩成两个决策
    rationale: G4 的取舍顺序（B > A > C）本身即支持"知情后放弃撤销"
    implications: 需在提交前探测快照可行性 → 两种终止态
    status: VOID
    void_reason: 2026-10-05 不实现导入撤销；提交路径收敛为单一终止态
    depends_on: [C5-snapshot-storage]

  - layer: constraint
    node: C7-no-undo-on-failure
    decision: 导入失败不需要撤销（由严格原子自动推出）
    rationale: 失败 = 零改动 = 无物可撤
    status: VOID
    void_reason: 2026-10-05 澄清对象（撤销）已不存在
    depends_on: [C3-atomicity]

  - layer: constraint
    node: C8-validation-strictness
    decision: 宽容读取 + 逐项披露 + 用户确认（仅限同 schema 版本内）；版本不符严格拒绝
    alternatives:
      - option: 全严格（任一即拒绝）
        rejected_reason: 用户选择保留可读性，但要求每处宽容可见
      - option: 宽松读取（静默取默认）
        rejected_reason: 把"文件损坏"变成"静默改配"
    rationale: 宽容 ≠ 静默 —— 把"我替你做了决定"变成"我告诉你，你同意再说"
    implications:
      - 宽容只发生在预检阶段，不降低原子性
      - diff 行项扩为 6 类（+忽略未知字段 / +填充默认值）
    revisions:
      - date: 2026-10-06
        change: T22 实施期裁定 —— tolerant 生产者须在本迭代落地（不得空壳）
        effect: |
          预检发现 tolerant 仅"类型声明 + 两处 tolerant: []"（import-export-service.ts:141 inspect /
          :430 apply），**无生产者**。裁定：**T22 内实现最小真实生产者**（不得标注"范围外"），理由：
          ① 本条（C8）RESOLVED 且 implications 明写"diff 行项扩为 **6 类**"；
          ② 计划 :2464 把"宽容项折叠汇总"列为 T22 交付项；
          ③ 留空壳 ⇒ T22 核心验收"六类各 ≥1 条"无法行为化，F1–F4 会判未交付。
          最小实现：解析期比对已声明形状的 allowlist（来源须引用 ExportPackage/PortableSlotDef/
          PortableRule 字段），每处未知键 ⇒ TolerantItem{kind:'unknown-field', detail:'<json path>'}；
          "默认值被填"半可单列并给做/延后建议，但"未知字段"半须落地；若需改包契约须先回报。
    status: RESOLVED
    depends_on: [C3-atomicity]
    revisions:
      - date: 2026-10-06
        change: T22 实施期裁定 —— "未知字段"半落地（T22）；"默认值被填"半**正式延后**（具名记账）
        effect: |
          T22 提交 2630427 落地了 tolerant 最小真实生产者（PACKAGE_FIELD_ALLOWLIST，root + slots[]/rules[]
          每项 keys ⇒ TolerantItem{kind:'unknown-field'}；inspect 与 apply 两处共用 collectTolerant）。
          "默认值被填"半裁定**延后**，理由：包内必需字段缺失走 D14 严格拒绝（不是"填默认"）；
          现存"填默认"只出现在 packageToSyncPatch 的**跨机派生默认**（strategy ?? 'inherit'、
          createdAt/updatedAt ?? now）—— 那是跨机语义而非文件缺陷；要披露须先定义"哪些派生默认值得报"
          ⇒ **需设计输入**。延后须**具名记账**（代码注释 + 提交信息各一句），不得静默。
          另：allowlist 须**编译期耦合**（as const satisfies Record<keyof PortableXxx, true>）——
          裸 as const 加字段忘同步不会编译失败（会静默漏检）；且只列 root/slot/rule 三层
          （icon 条目已删：实现有意不深走 urlMatch/marker/icon 内部）。
    status: RESOLVED

  - layer: constraint
    node: C9-missing-icon
    decision: 保留裸引用 + 一次性告知；缺失由消费方判定
    alternatives:
      - option: 值置空
        rejected_reason: 只能满足"告知"，无法满足设计要求的"展示占位"（属持续状态）
      - option: 值置空 + 持久化待重选标记
        rejected_reason: 需扩展 schema；而引用 + 消费方判定已能推导出同一状态
      - option: 保留占位字符串（今日 [local:…]）
        rejected_reason: 已证否 —— 带包装的字符串永远解析不了
    rationale: 贴合既有实现（引用与解析器已存在），改动面最小
    implications:
      - 需导出裸发引用（C2）
      - 需消费方规则：引用无法解析 ⇒ 视为缺失 ⇒ 显示占位
    status: RESOLVED
    depends_on: [C1-icon-carriage, C2-export-deref]

  - layer: constraint
    node: C10-icon-key-clearing
    decision: 替换记录时同步清空其图标存储槽
    alternatives:
      - option: 引用键加内容哈希/uuid
        rejected_reason: 现存 >6KB 图标已以 icon:slot-N 落库且是唯一副本，改键会让图标集体变缺失（数据回归）
    rationale: 键由记录 id 派生（slot id 恒为 1..10）→ 目标机可能"假成功解析"取到自己的图标，比破图更糟
    implications:
      - ① 作用域严格：只对真正写入的记录
      - ② 与写入同属一次原子操作（失败即补偿）
      - ③ 快照覆盖（后作废 —— 清空为永久删除）
    status: RESOLVED
    depends_on: [C9-missing-icon, C3-atomicity]

  - layer: constraint
    node: C11-missing-list-producer
    decision: 缺失清单是 APPLY 的产物（一次性告知），不是读取侧状态；读取侧保留裸引用（C9）
    alternatives:
      - option: 在 resolveIconReferences 失败分支置空 / 抹去 local-icon: 前缀
        rejected_reason: 会抹掉消费方唯一的缺失判据（resolveForDisplayState 依赖 value.startsWith('local-icon:')）⇒ D9"缺失 vs 本来没有"不可区分，等于自毁 T6
      - option: 扩展 getSyncState() 契约携带缺失位
        rejected_reason: 影响全部消费方（链路 / 投递 / UI）；且 C9 已否决"需扩展 schema 才能推导状态"的方向
      - option: 另设可轮询的 getMissingIcons() 旁路查询
        rejected_reason: 与 C9"一次性告知"语义不符——清单是导入应用那一刻的结果，不是持续状态
    rationale: 两层分离——持久 / 读取态保留裸引用（C9），显示态由消费方判定（D9）；清单只在 APPLY 结果里登记一次
    implications:
      - resolveIconReferences 失败分支行为不变（保留 local-icon: 字面量，不置空）
