  # ─── 🏗️ Architecture ─────────────────────────────────────────────────────

  - layer: architecture
    node: A1-package-self-description
    decision: 缺失即权威 + 按维度显式选择模式（默认增量）；不设 manifest
    alternatives:
      - option: manifest（包内显式清单）
        rejected_reason: 意图已显式后属冗余；需维护"清单与内容一致"的第二重校验
      - option: 类型化缺失（null/[]/absent 约定）
        rejected_reason: JSON 中极易写错，而 C8 的宽容会掩盖这类错误
    rationale: 含义由用户明确声明而非推断
    implications: 需按维度建模；覆盖导入的高风险默认落在保留（增量）
    status: RESOLVED
    depends_on: [G5-import-boundary, C4-server-authority]
    conflicts_resolved:
      - conflict: "'缺失' 一词在 G5 里被重载（文件驱动 = 不碰；清空意图 = 删除）"
        resolution: 由按维度显式模式消解

  - layer: architecture
    node: A2-absent-dimension
    decision: 文件未承载的维度不提供选择器；UI 标注"本包未包含规则"，按增量处理
    alternatives:
      - option: 照覆盖执行（删除该维度全部）
        rejected_reason: 一次误选即全毁；且这类删除无法被 diff 行项充分表达
      - option: 提供选择器但覆盖需二次确认
        rejected_reason: 用户选择更彻底的做法：直接不给入口
    rationale: 把"用干净包重置规则"的表达限制在合法路径上
    status: RESOLVED
    depends_on: [A1-package-self-description]

  - layer: architecture
    node: A3-tri-state
    decision: 未携带 = 字段不存在；已携带但为空 = 空数组 []；两者 UI 与模式选择不同
    rationale: 三态由 JSON 语法天然区分，无需额外清单
    implications: 非数组维度（settings/switchDirection/autoBindGlobal）只有两态
    status: RESOLVED
    depends_on: [A2-absent-dimension]

  - layer: architecture
    node: A4-per-record-override
    decision: 逐维度模式为默认值，逐记录可覆盖；提供 diff
    alternatives:
      - option: 文件一律胜出（维度模式为唯一输入）
        rejected_reason: 与既有设计要求冲突（detail-ui-validation-design.md:58 要求逐项选择）
      - option: 逐记录决策为准（维度模式仅批量设置）
        rejected_reason: 会弱化"按维度表达意图"这一 A1 的基础
    rationale: 恰好是既有设计"逐项选择 + 一键全选"的推广，无需修订 ADR
    implications: 意图载荷 = 各维度模式 + 稀疏记录级覆盖（有界，服务端可重算）
    status: RESOLVED
    depends_on: [A1-package-self-description]

  - layer: architecture
    node: A5-no-comparison
    decision: 不做比对（不校验文件是否在预览后变化）
    alternatives:
      - option: 文件指纹
        rejected_reason: 用户判断实践中几乎总成立
      - option: 全量结果比对
        rejected_reason: 重复一次确定性推导；载荷随记录数线性膨胀
    rationale: 权威性不受影响（服务端写的是当前文件内容），仅告知性收窄
    implications: 残余风险曾存在（后由 D12 构造性消除）
    status: SUPERSEDED
    superseded_by: D12-shared-string
    depends_on: [C4-server-authority]

  - layer: architecture
    node: A6-recipe-value-model
    decision: 配方只存在于存储层，链路解析时渲染；链路值模型零改动
    alternatives:
      - option: 链路值扩展为可携带配方
        rejected_reason: MaskedSummary 把 node.value 当文本渲染，联合类型会显示成对象
      - option: 存储层同时保存配方与渲染结果
        rejected_reason: 两份状态不一致时会静默投递旧图标
    rationale: 配方成为唯一持久真源，渲染值只作缓存；与 local-icon 走同一条路
    implications:
      - 必须真用 iconResolutionCache 记忆化
      - 渲染统一在 background，用 OffscreenCanvas 产出 PNG；UI 与投递路径共用同一结果
      - 须补写入门禁适配：三处门禁需排除 type:'template'（配方 value 为空串，会被 url-utils.ts:618 误拒）
