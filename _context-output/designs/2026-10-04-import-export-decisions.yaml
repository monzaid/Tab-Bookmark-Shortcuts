      的设置字段** ⇒ 第 14/15 项是**必要项，非加固项**。
      [#15 判据形态更正（防退化为结构断言）] "非法包 ⇒ 返回 `IMPORT_INVALID` 而非抛异常"**字面不成立**：
      经 `worker-orchestrator.ts:484` `.catch`，抛出**并不**变成 `IMPORT_INVALID`，而是 **`INTERNAL_ERROR`**
      （`handleMessage` 本就设计为"绝不挂起调用方"）。⇒ **决定性证据 = 起始态行为**（崩 ⇒ 经编排器成
      `INTERNAL_ERROR`），**不是**"缺少校验点"（后者校验器一加即变）。
      [#15 行为型 RED/GREEN · 采纳 reviewer 的更准形态]
      RED（基线）：畸形**容器**（如 `slots:'x'`）经**编排器边界** ⇒ `errorCode === 'INTERNAL_ERROR'`、store 未变；
      GREEN（修复）：同输入经编排器 ⇒ `errorCode === 'IMPORT_INVALID'`、store 未变。
      **必须经编排器边界**（直调 service 在基线会抛 ⇒ 测不出 `INTERNAL_ERROR`）。该形态**比"返回显式错误、
      无抛出"更可判别**：它同时证明**守卫在 `computeDiff` 之前生效**（否则仍是 `INTERNAL_ERROR`）。
      [#16 拆两半写死（采纳 reviewer）]
      ① `isExportPackage` 容器类型收紧 —— 含**既有正例保绿**：`export-package-map.test.ts:131-139`
      中 `{schemaVersion:1,generator:{},exportedAt:'x',scope:{}}` **现被接受**，收紧后**仍应通过**
      （无 `slots/rules/settings/shortcuts` = 全缺席 = 合法）⇒ **该正例不得被误伤**；
      ② 经编排器的 `INTERNAL_ERROR → IMPORT_INVALID` 行为型 RED/GREEN + store 未变。
      ⇒ #15 与 #16 不重叠、各自可失败。
    status: RESOLVED

