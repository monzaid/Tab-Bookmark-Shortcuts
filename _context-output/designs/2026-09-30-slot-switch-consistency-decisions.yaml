    decision: "偏序 + 回退（**none 档为最严例外**）：none = **绑定 tab 必须存在且 URL 仍匹配，任一不满足 → Tab Not Found，绝不回退 URL 候选**【修正 2026-09-30 · 用户裁定 C-A2 + Q1-B】；tabId = 存活即切（不校验 URL）否则用 URL 候选；rule check = 先用 URL 候选，无匹配才回退切绑定 tab"
    alternatives:
      - { option: "三档皆强制 URL 校验", rejected_reason: "使 tabId 与 none 几无差别，失去该档意义" }
    implications: "新默认（组合1+tabId）≠ 旧默认 B —— 属可感知变更，由 D10 迁移策略约束。**【修正 2026-09-30 · C-A2 + Q1-B】none 档为最严档：绑定 tab『不存在』或『存在但 URL 漂移』**均**返回 recovery（Tab Not Found），不再回退 URL 候选；此为用户裁定，覆盖主设计 §3.1 四格表与本条的原字面措辞（已同步 amended）**"
    status: RESOLVED
