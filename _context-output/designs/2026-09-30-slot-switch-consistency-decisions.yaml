    decision: "环 = 当前窗口存活标签页；起点 = 该槽上次成功切换的标签页（游标）；游标缺失 → Tab Not Found；首次 → 以当前活动页为起点"
    alternatives:
      - { option: "活动页起点", rejected_reason: "无视游标，使 slot 保有自身游标失去作用" }
      - { option: "binding 起点", rejected_reason: "组合 4 前提即 binding 失效 → 退化为永远 Tab Not Found" }
    implications: "经 A4 精化：游标即 binding.tabId（用户裁决），故 D4 的 'binding 起点' 对本模型成立"
