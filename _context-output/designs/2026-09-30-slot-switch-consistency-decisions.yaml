    decision: "background 统一负责：SWITCH_SLOT 结果 needs_recovery → background 开窗；调用方都不自行开窗；侧边栏删除误导性 toast"
    alternatives:
      - { option: "调用方各自负责", rejected_reason: "一致性靠两处碰巧同步，正是本轮 bug 成因；3/4 新增窗口逻辑会多处重复" }
