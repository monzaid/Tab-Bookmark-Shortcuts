    decision: "【已废弃 2026-09-30】原裁决为'迁移保行为 + 新默认仅新装'。用户裁定：**不做兼容、不做迁移**（应用未公测、无用户历史）→ 删除 globalStrategy，新增 matchSettings；旧持久化数据被忽略、静默落到新默认 exists+match+priority=tabId；不提示、不备份"
    alternatives:
      - { option: "迁移保行为（A→组合2 / B→组合1·none / C→组合3 无损映射）", rejected_reason: "[原已采纳，2026-09-30 由用户推翻] 无用户历史，无需保行为；且迁移需兼容层，导致契约前置期 typecheck 死结（TS2367）" }
      - { option: "升级即重置为新默认", rejected_reason: "[原被否决，现成为实际选择] 无用户历史下重置即预期行为" }
    rationale: "应用未公测；旧 A/B/C 与新四格的对应关系降级为纯语义参考表，不产生迁移代码"
    implications: "A/B/C→新格对照表保留为文档语义说明；无 schemaVersion"
