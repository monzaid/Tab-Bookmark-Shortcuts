      - { option: "扩展 cycleCursors", rejected_reason: "与实时查询矛盾（无需存候选集）" }
    implications: "Goal D4/D5 的'游标'术语收紧为 binding；binding 仅由提交类动作推进"
    status: RESOLVED
    depends_on: [D4]
  - id: A4b
    layer: architecture
    node: binding 更新矩阵
    decision: "提交类（组合4 Switch to slot x / Strategy C / Recovery Open URL）更新 binding；浏览类（slot 行与 Current Page 的 ⤺/↻、↑/↓、Recovery Prev/Next 除 autoBind 勾选）刻意不更新"
    alternatives:
      - { option: "收敛统一（所有动作都更新）", rejected_reason: "[RECOMMENDED, REJECTED BY USER] 用户选择刻意分裂" }
    implications: "已确认有意行为：Match 循环后按组合4快捷键 → 聚焦回 binding；实现处须显式注释防被当遗漏修掉"
    status: RESOLVED
    depends_on: [A4]
  - id: A5
    layer: architecture
    node: SwitchOutcome 扩展
    decision: "【修正 · BLK-B / B2，2026-09-30 裁决】撤销原计划的 protected_blocked 变体；SwitchOutcome 既有 4 变体完全不动；聚焦/步进复用既有 switched；特权页拦截改用既有 domain error PROTECTED_PAGE（types.ts:247），由恢复窗走窗内报错路径渲染"
