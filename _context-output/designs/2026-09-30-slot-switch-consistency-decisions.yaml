# ─────────────────────────── Architecture ───────────────────────────
  - id: A1
    layer: architecture
    node: item1 修复点
    decision: "新增 applySwitchOutcome(outcome, context) 置于 worker-orchestrator；routeMessage(SWITCH_SLOT) 与 handleCommand(switch-slot-x) 都调用；由其唯一负责恢复窗/通知/诊断"
    alternatives:
      - { option: "副作用下沉 slotService", rejected_reason: "服务耦合 windows+notifications" }
      - { option: "UI 层统一", rejected_reason: "与 D2 冲突" }
    rationale: "基线修正：两条路径本就共用 slotService.switchSlot，分歧仅在结果副作用"
    status: RESOLVED
    depends_on: [D2]
  - id: A2
    layer: architecture
    node: 副作用映射契约
    decision: "needs_recovery→create-or-focus+no_target通知+诊断；switched+crossWindow→cross_window_switch；其余→仅诊断；全程幂等（同 slotId 复用一个窗；单次调用只跑一遍映射）"
    alternatives:
      - { option: "只处理 needs_recovery", rejected_reason: "保留多处副作用点，等于把 item1 成因留在架构里" }
    status: RESOLVED
    depends_on: [A1, D12]
  - id: A3
    layer: architecture
    node: 状态归属
    decision: "sync：三旋钮策略/switchDirection/autoBindGlobal/schemaVersion；local：bindings/cycleCursors/recoverySessions/iconCache"
    alternatives:
      - { option: "全部 sync", rejected_reason: "tabId 派生状态跨设备无效/有害，且耗尽 sync 配额" }
      - { option: "全部 local", rejected_reason: "用户偏好失去跨设备同步（能力回退）" }
    rationale: "用户意图（应同步）与设备现实（不应同步）切开"
    status: RESOLVED
  - id: A4
